<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="start">
        <h1 class="gg">FlashBoard</h1>
        <p class="ggg">Write a task, add it as a cars, then drag it between zones.</p>
    </div>

    <form class="form">

        <div class="mid-start">
            <input class="mid-input text" placeholder="  e.g. Go to sleep" type="text">
            <button class="mid-btn btn" type="submit">ADD CARD</button>
        </div>

    </form>

    <div class="progreska-zona">
        <span class="X-X-X-text-info">1 of 3 tasks accomplished (33%)</span>

        <div class="sariq-chizik-emas">
            <div class="tochka-33-foiz"></div>
        </div>
    </div>

    <div class="bosh-kosmos-doska">

        <div class="uyda-otirganlar">

            <div class="boshliklar-yigini">
                <span class="xozircha-tinch">To do</span>
                <span class="sanoq-mashinasi">1</span>
            </div>

            <div class="qizil-chizigcha"></div>

            <div class="todo-cards list"></div>

        </div>

        <div class="uyda-otirganlar">

            <div class="boshliklar-yigini">
                <span class="xozircha-tinch">Important</span>
                <span class="sanoq-mashinasi">1</span>
            </div>

            <div class="qizil-chizigcha"></div>

            <div class="kartoshka-quti">kitob o'qish</div>

        </div>

        <div class="uyda-otirganlar">

            <div class="boshliklar-yigini">
                <span class="xozircha-tinch">Accomplished</span>
                <span class="sanoq-mashinasi">1</span>
            </div>

            <div class="qizil-chizigcha"></div>

            <div class="kartoshka-quti tugatilgan-ishi">
                <span>🔒 Domashka</span>
            </div>

        </div>

        <div class="uyda-otirganlar xapamatuz-musorxona">

            <div class="boshliklar-yigini">
                <span class="xozircha-tinch">Musr</span>
            </div>

            <div class="musor-qutisi-ichida">
                <div class="baqirayotgan-baklashka">🗑️</div>
                <span class="nol-Sanoq">Deleted: 0</span>
            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
